name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write    # needed for releases
  security-events: write

env:
  # Work around setup-go tar cache conflicts
  TAR_OPTIONS: --skip-old-files

jobs:
  # ---------- Test ----------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Use your project’s supported version or 'stable'
          go-version: 'stable'   # or '1.22' / '1.23'
          cache: true

      - name: Go test
        run: go test ./...

  # ---------- Lint ----------
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0          # keep this within 2 latest releases
          args: >
            --timeout=5m            # increase timeout for CI
            ./...
          # if you have a config file, include:
          # config: .golangci.yml

  # ---------- Security scan (optional but recommended) ----------
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run gosec
        uses: securego/gosec@v2
        with:
          args: ./...

  # ---------- Build binaries ----------
  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security]

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: scalemind-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: scalemind-linux-arm64
          - goos: darwin
            goarch: amd64
            binary_name: scalemind-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: scalemind-darwin-arm64
          - goos: windows
            goarch: amd64
            binary_name: scalemind-windows-amd64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-w -s" -o "${{ matrix.binary_name }}" ./cmd/... || \
          go build -ldflags="-w -s" -o "${{ matrix.binary_name }}" ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 30

  # ---------- Release on tag ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-binaries
          merge-multiple: true

      - name: List downloaded files
        run: |
          ls -la ./release-binaries
          find ./release-binaries -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}