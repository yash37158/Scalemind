name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Add permissions for GITHUB_TOKEN
permissions:
  contents: write  # Required to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: scalemind-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: scalemind-linux-arm64
          - goos: darwin
            goarch: amd64
            binary_name: scalemind-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: scalemind-darwin-arm64
          - goos: windows
            goarch: amd64
            binary_name: scalemind-windows-amd64.exe
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-w -s" -o ${{ matrix.binary_name }} main.go
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-binaries
          merge-multiple: true  # 🔧 FIX: Merge all artifacts into one directory
      
      - name: List downloaded files
        run: |
          ls -la ./release-binaries/
          find ./release-binaries -type f
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release-binaries/*  # Now this will match files correctly
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}